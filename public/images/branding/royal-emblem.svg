<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA7"/>
      <stop offset="25%" stop-color="#E5B94E"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="75%" stop-color="#E2B842"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B27" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Inner Border -->
  <rect x="11" y="11" width="98" height="98" rx="23" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Royal Crown Structure -->
  <g filter="url(#softGlow)">
    <!-- Crown Base Band -->
    <rect x="36" y="55" width="48" height="6.5" rx="3.25" fill="url(#goldGrad)"/>
    <!-- Small Crown jewels on band -->
    <circle cx="43" cy="58.25" r="1.5" fill="#081426"/>
    <circle cx="60" cy="58.25" r="1.8" fill="#081426"/>
    <circle cx="77" cy="58.25" r="1.5" fill="#081426"/>

    <!-- Crown Peaks -->
    <path d="M38 55 L35 34 L48 44 L60 26 L72 44 L85 34 L82 55 Z" fill="url(#goldGrad)"/>

    <!-- Crown Jewels on Top Peaks -->
    <circle cx="35" cy="33" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="60" cy="24" r="3.8" fill="url(#goldGrad)"/>
    <circle cx="85" cy="33" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="48" cy="43" r="1.6" fill="url(#goldGrad)"/>
    <circle cx="72" cy="43" r="1.6" fill="url(#goldGrad)"/>
  </g>

  <!-- Modern Luxury Cab Silhouette / Wings -->
  <g fill="url(#goldGrad)">
    <!-- Cab Top & Windshield -->
    <path d="M47 67 C48 64, 53 63, 60 63 C67 63, 72 64, 73 67 L79 73 C81 74, 82 76, 82 78 L82 82 C82 83.5, 80.5 84.5, 79 84.5 L77 84.5 C75.5 84.5, 74 83.5, 74 82 L74 80 L46 80 L46 82 C46 83.5, 44.5 84.5, 43 84.5 L41 84.5 C39.5 84.5, 38 83.5, 38 82 L38 78 C38 76, 39 74, 41 73 Z" opacity="0.95"/>
    
    <!-- Windshield Cutout -->
    <path d="M49 67.5 L51 72 L69 72 L71 67.5 C68 65.5, 52 65.5, 49 67.5 Z" fill="#081426"/>
    
    <!-- Headlights -->
    <circle cx="43" cy="76" r="2" fill="#FFFBEB"/>
    <circle cx="77" cy="76" r="2" fill="#FFFBEB"/>

    <!-- Cab Grille Lines -->
    <line x1="55" y1="76" x2="65" y2="76" stroke="#081426" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56" y1="78.5" x2="64" y2="78.5" stroke="#081426" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Laurel / Wings Base Ribbon Accent -->
  <path d="M28 89 C40 96, 80 96, 92 89 C88 93, 74 97, 60 97 C46 97, 32 93, 28 89 Z" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="60" cy="91" r="2" fill="url(#goldGrad)"/>
</svg>
